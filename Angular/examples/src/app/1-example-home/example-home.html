<div class="shell">
  <nav>
    <!-- RouterLink makes these client-side navigations (no full page reload).
         RouterLinkActive adds the "active" class to the link matching the current route. -->
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/templates" routerLinkActive="active">Templates</a>
    <a routerLink="/components" routerLinkActive="active">Components</a>
    <a routerLink="/directives" routerLinkActive="active">Directives</a>
    <a routerLink="/pipes" routerLinkActive="active">Pipes</a>
    <!-- Add links to the example components here as they are added to the routes. -->
  </nav>

  <!-- Routed components render here. App (the angular-generated welcome page) and any
       example feature components are swapped in by the router based on the URL. -->
  <router-outlet />
</div>
